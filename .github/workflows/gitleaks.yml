name: gitleaks-secret-scan

# 密钥扫描 CI: 推送/PR/定时 全历史扫描 (与本地 pre-push hook 同规则)
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *" # 每天 04:17 UTC

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan git history (all refs)
        run: gitleaks git . --config=scripts/gitleaks.toml --log-opts="--all" --no-banner