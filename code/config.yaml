# RAG Plugin 配置
# 路径配置
chromadb:
  path: ~/rag_chromadb
  collection: wiki_docs
  embedding_model: BAAI/bge-base-zh-v1.5

sag:
  db_path: /mnt/c/Users/Eric Jia/SAG-poc/sag_lite.db

okf:
  root: /mnt/d/MD/RAG知识库/okf_bundle

# LLM 通道
llm:
  channels:
    - id: mizu
      base_url: https://sd6f7boe66in4kbsvm3og.apigateway-ap-southeast-1.volceapi.com/v1
      model: anonymous/mizu
    - id: qwen
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model: qwen-plus
  timeout_ms: 60000
  max_tokens: 800

# Reranker
reranker:
  enabled: true              # 是否启用 cross-encoder 重排序
  model: BAAI/bge-reranker-base
  top_k: 25                  # 重排候选数量
  mirror: https://hf-mirror.com  # HF 镜像（国内加速）

# 功能名称精准召回 — 向量检索易混淆的 FANUC 选项/功能名
# 语法: "匹配正则": ["$contains词1", "$contains词2", ...]
feature_name_kw:
  "pc\\s*interface|PCIF|pcif":
    - "PC Interface"
    - "PCIF"
    - "pc interface"
    - "pcif"
  "device\\s*net|devicenet":
    - "DeviceNet"
    - "devicenet"
    - "Device Net"
  "RTCP|remote\\s*tcp|远程\\s*TCP":
    - "远程 TCP"
    - "Remote TCP"
    - "RTCP"
  "高惯量|High\\s*Inertia":
    - "高惯量"
    - "High Inertia"
  "物料搬运|Material\\s*Handling":
    - "物料搬运"
    - "Material Handling"

# 检索策略
retrieval:
  strategy: hybrid  # hybrid | vector-only | entity-only
  top_k: 6
  entity_exact_weight: 0.95
  entity_hop_weight: 0.75

# 飞轮
flywheel:
  smoke_count: 5
  batch_count: 200
  target_pass_rate: 0.95
